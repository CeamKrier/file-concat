<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FileConcat Clipper</title>
    <style>
      /* Ported from apps/web/src/styles/app.css. The panel cannot load the
         brand webfonts without shipping them, so the warm-dark palette, the
         hairlines and the radius carry the identity and type falls back to the
         system stack. */
      :root {
        --background: #16130f;
        --card: #1c1812;
        --surface-inset: #120f0a;
        --foreground: #f1ebe0;
        --text-secondary: #b3a994;
        --text-muted: #8d8472;
        --text-faint: #6f675a;
        --hairline: #221d16;
        --border: #2c261d;
        --border-strong: #342d22;
        --go: #7acd8e;
        --go-text: #9fdcb0;
        --go-ink: #11261a;
        --info: #e3b96a;
        --stop: #e08c7a;
        --radius: 0.5rem;
        --settle: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      /* A panel is a column with a floor, not a card that grows. The two lists
         scroll against each other so a 30-video page can never push the tray
         out of reach, and Send never leaves the screen. */
      body {
        margin: 0;
        min-width: 280px;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--hairline);
        flex: none;
      }

      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .origin {
        color: var(--text-muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--hairline);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      /* Now is bounded by its content; the tray takes what is left, because the
         tray is the thing that accumulates over a session. */
      #tray-section {
        flex: 1;
        border-bottom: 0;
      }

      .label {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--text-muted);
        font-size: 11px;
        flex: none;
      }

      .note {
        margin: 0;
        color: var(--text-muted);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        min-height: 0;
      }

      ul:not(:empty) {
        padding: 3px;
        overflow-y: auto;
        overscroll-behavior: contain;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
      }

      #page-list:not(:empty) {
        max-height: 40vh;
        margin-bottom: 10px;
      }

      #tray-list:not(:empty) {
        flex: 0 1 auto;
      }

      /* A row is the label, so the whole strip is the hit target. */
      li label,
      .toggle {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 6px 8px;
        border-radius: calc(var(--radius) - 2px);
        cursor: pointer;
      }

      li label:hover,
      .toggle:hover {
        background: var(--card);
      }

      /* The toggle sits in the same row idiom as a video, one step in from the
         section edge, so it reads as part of the act it changes. */
      .toggle {
        margin: 0 0 10px -8px;
      }

      li input[type="checkbox"],
      .toggle input[type="checkbox"] {
        margin: 2px 0 0;
        accent-color: var(--go);
        flex: none;
      }

      .hint {
        display: block;
        color: var(--text-muted);
        font-size: 11px;
      }

      .row-text {
        min-width: 0;
        flex: 1;
      }

      .row-title {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-meta {
        display: block;
        color: var(--text-muted);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* A tray row carries its own fate. The state is a word, never a colour
         alone, and a finished row says nothing at all — quiet is the success
         state, and the folder it landed in is more use than the word "done". */
      .tray-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 6px 8px;
        border-radius: calc(var(--radius) - 2px);
        position: relative;
      }

      .tray-row:hover {
        background: var(--card);
      }

      .state {
        flex: none;
        font-size: 11px;
        color: var(--text-muted);
        padding-top: 1px;
      }

      .tray-row[data-state="fetching"] .state {
        color: var(--info);
      }

      .tray-row[data-state="failed"] .state {
        color: var(--stop);
      }

      .tray-row[data-state="failed"] .row-meta {
        color: var(--stop);
        white-space: normal;
      }

      /* The one authored moment: a row arrives unsettled and resolves. Pending
         work is literally out of focus until it is real. */
      .tray-row[data-state="queued"],
      .tray-row[data-state="fetching"] {
        opacity: 0.62;
        filter: blur(0.4px);
      }

      .tray-row {
        transition:
          opacity var(--settle),
          filter var(--settle);
      }

      /* A fetching row draws its own hairline, so activity is visible per row
         rather than in one shared status line. */
      .tray-row[data-state="fetching"]::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 2px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--info), transparent);
        animation: sweep 1.1s linear infinite;
      }

      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(100%);
        }
      }

      .remove {
        flex: none;
        width: auto;
        padding: 0 2px;
        border: 0;
        background: none;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.2;
        cursor: pointer;
        transition: color var(--settle);
      }

      .remove:hover {
        color: var(--stop);
      }

      button {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        border-color: var(--border-strong);
      }

      button.primary {
        background: var(--go);
        border-color: var(--go);
        color: var(--go-ink);
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      :focus-visible {
        outline: 2px solid var(--go);
        outline-offset: 2px;
      }

      .link {
        width: auto;
        padding: 0;
        border: 0;
        background: none;
        color: var(--text-muted);
        font-size: 11px;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .link:hover:not(:disabled) {
        color: var(--foreground);
      }

      footer {
        flex: none;
        padding: 12px 14px;
        border-top: 1px solid var(--hairline);
        background: var(--surface-inset);
      }

      /* Status carries a text prefix rather than colour alone. */
      #status {
        margin: 8px 0 0;
        min-height: 16px;
        font-size: 11px;
        color: var(--text-muted);
      }

      #status[data-tone="working"] {
        color: var(--info);
      }

      #status[data-tone="done"] {
        color: var(--go-text);
      }

      #status[data-tone="error"] {
        color: var(--stop);
      }

      [hidden] {
        display: none !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .tray-row {
          transition: none;
        }
        .tray-row[data-state="queued"],
        .tray-row[data-state="fetching"] {
          filter: none;
        }
        .tray-row[data-state="fetching"]::after {
          animation: none;
          background: var(--info);
          right: 70%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>FileConcat Clipper</h1>
      <span class="origin" id="origin"></span>
    </header>

    <main>
      <section id="page-section">
        <div class="label">
          <span id="page-label">Now</span>
          <button class="link" id="select-all" type="button" hidden>Select all</button>
        </div>
        <p class="note" id="page-note" hidden></p>
        <ul id="page-list"></ul>
        <label class="toggle" id="option-row" hidden>
          <input type="checkbox" id="option" />
          <span id="option-label">
            Include comments
            <span class="hint" id="option-hint">Top 20 per video. Up to 45% more tokens on a short one.</span>
          </span>
        </label>
        <button id="clip" type="button" hidden>Clip this video</button>
      </section>

      <section id="tray-section">
        <div class="label">
          <span id="tray-label">Tray</span>
          <button class="link" id="clear" type="button" hidden>Clear</button>
        </div>
        <p class="note" id="tray-note" hidden>Nothing clipped yet.</p>
        <ul id="tray-list"></ul>
      </section>
    </main>

    <footer>
      <button class="primary" id="send" type="button" disabled>Send to FileConcat</button>
      <p id="status" role="status" aria-live="polite"></p>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
